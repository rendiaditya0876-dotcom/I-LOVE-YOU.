<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You! - Animasi Ramai & Lucu</title>
  <style>
    /* ==========================================
       1. RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', cursive, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================
       2. BACKGROUND FLOATING ELEMENTS
       ========================================== */
    .bg-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .floating-item {
      position: absolute;
      bottom: -50px;
      animation: floatUp linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* ==========================================
       3. MAIN CONTAINER & CARD
       ========================================== */
    .card-container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 4px solid #fff;
      border-radius: 30px;
      padding: 30px 20px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(255, 105, 180, 0.4),
                  0 0 20px rgba(255, 255, 255, 0.8);
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Speech Bubble */
    .speech-bubble {
      position: relative;
      background: #ff4757;
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
      display: inline-block;
      max-width: 85%;
      animation: bounce 2s infinite;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #ff4757 transparent;
      display: block;
      width: 0;
    }

    /* Mascot Bear SVG */
    .mascot-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 10px auto;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }

    .mascot-wrapper:hover {
      transform: scale(1.08) rotate(3deg);
    }

    .mascot-wrapper:active {
      transform: scale(0.95);
    }

    /* Bouncing Animated Title */
    .title-love {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff2e63;
      text-shadow: 3px 3px 0px #fff, 
                   6px 6px 0px #ff9a9e,
                   8px 8px 15px rgba(0,0,0,0.15);
      letter-spacing: 2px;
      margin: 10px 0;
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .title-love span {
      display: inline-block;
      animation: jump 1.2s infinite ease-in-out;
    }

    .title-love span:nth-child(1) { animation-delay: 0.0s; color: #ff3366; }
    .title-love span:nth-child(2) { animation-delay: 0.1s; color: #ff6699; }
    .title-love span:nth-child(3) { animation-delay: 0.2s; color: #ff3399; }
    .title-love span:nth-child(4) { animation-delay: 0.3s; color: #ff0066; }
    .title-love span:nth-child(5) { animation-delay: 0.4s; color: #ff3366; }
    .title-love span:nth-child(6) { animation-delay: 0.5s; color: #ff6699; }
    .title-love span:nth-child(7) { animation-delay: 0.6s; color: #ff0055; }
    .title-love span:nth-child(8) { animation-delay: 0.7s; color: #ff3385; }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.15) rotate(5deg); }
    }

    /* Subtitle Heart Beats */
    .heart-beat {
      font-size: 2rem;
      display: inline-block;
      animation: heartbeat 0.8s infinite alternate;
      margin: 5px 0 15px 0;
    }

    @keyframes heartbeat {
      from { transform: scale(1); }
      to { transform: scale(1.3); }
    }

    /* ==========================================
       4. BUTTONS & CONTROLS
       ========================================== */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .btn {
      border: none;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
    }

    .btn-secondary {
      background: linear-gradient(45deg, #eccc68, #ffa502);
      color: white;
    }

    .btn-music {
      background: linear-gradient(45deg, #70a1ff, #1e90ff);
      color: white;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 15px 25px rgba(0,0,0,0.15);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }

    /* Floating Particles Effects */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: burst 1s ease-out forwards;
      z-index: 99;
    }

    @keyframes burst {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="bg-elements" id="bgElements"></div>

  <!-- Main Card Container -->
  <div class="card-container">
    
    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
      Klik aku atau tombol di bawah ya! 💖
    </div>

    <!-- Animated Bear Mascot (SVG) -->
    <div class="mascot-wrapper" id="mascot" onclick="triggerMascotReaction()">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <!-- Ears -->
        <circle cx="55" cy="55" r="28" fill="#B57C47" />
        <circle cx="55" cy="55" r="16" fill="#FFC3A0" />
        <circle cx="145" cy="55" r="28" fill="#B57C47" />
        <circle cx="145" cy="55" r="16" fill="#FFC3A0" />
        
        <!-- Head -->
        <circle cx="100" cy="100" r="65" fill="#C68B59" />
        
        <!-- Snout -->
        <ellipse cx="100" cy="115" rx="25" ry="20" fill="#FFF2E2" />
        <polygon points="100,105 92,113 108,113" fill="#4A2E16" />
        <path d="M 100 113 Q 93 123 88 118 M 100 113 Q 107 123 112 118" stroke="#4A2E16" stroke-width="3" fill="none" stroke-linecap="round" />
        
        <!-- Eyes -->
        <circle cx="75" cy="90" r="7" fill="#222" />
        <circle cx="73" cy="88" r="2.5" fill="#FFF" />
        <circle cx="125" cy="90" r="7" fill="#222" />
        <circle cx="123" cy="88" r="2.5" fill="#FFF" />
        
        <!-- Cheeks -->
        <ellipse cx="62" cy="105" rx="10" ry="6" fill="#FF8DA1" opacity="0.8" />
        <ellipse cx="138" cy="105" rx="10" ry="6" fill="#FF8DA1" opacity="0.8" />

        <!-- Big Heart in Paws -->
        <g id="bearHeart">
          <path d="M 100 165 C 100 165 70 140 70 120 C 70 108 80 100 90 108 C 100 116 100 116 100 116 C 100 116 100 116 110 108 C 120 100 130 108 130 120 C 130 140 100 165 100 165 Z" fill="#FF3366" />
        </g>
        
        <!-- Paws -->
        <circle cx="72" cy="135" r="12" fill="#B57C47" />
        <circle cx="128" cy="135" r="12" fill="#B57C47" />
      </svg>
    </div>

    <!-- Animated Bouncing Title -->
    <div class="title-love">
      <span>I</span>
      <span style="margin-right: 10px;"></span>
      <span>L</span>
      <span>O</span>
      <span>V</span>
      <span>E</span>
      <span style="margin-right: 10px;"></span>
      <span>U</span>
      <span>!</span>
    </div>

    <div class="heart-beat">💖</div>

    <!-- Action Buttons -->
    <div class="button-group">
      <button class="btn btn-primary" onclick="burstHearts(event)">
        <span>💌</span> Kirim Ledakan Cinta!
      </button>
      <button class="btn btn-secondary" onclick="nextGombalan()">
        <span>✨</span> Gombalan Lucu
      </button>
      <button class="btn btn-music" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span> <span id="musicText">Putar Musik Romantis</span>
      </button>
    </div>

  </div>

  <script>
    /* ==========================================
       1. GENERATE FLOATING BACKGROUND ELEMENTS
       ========================================== */
    const bgElementsContainer = document.getElementById('bgElements');
    const icons = ['❤️', '💖', '💕', '💗', '✨', '🌸', '🧸', '☁️', '🥰', '💌'];

    function createBgElement() {
      const item = document.createElement('div');
      item.classList.add('floating-item');
      item.innerText = icons[Math.floor(Math.random() * icons.length)];
      
      // Randomize positioning and timing
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (Math.random() * 20 + 20) + 'px';
      const duration = Math.random() * 5 + 5;
      item.style.animationDuration = duration + 's';
      
      bgElementsContainer.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, duration * 1000);
    }

    // Generate elements periodically
    setInterval(createBgElement, 400);

    /* ==========================================
       2. GOMBALAN / SPEECH BUBBLE MESSAGES
       ========================================== */
    const gombalanList = [
      "Kamu tahu gak? Aku sayang kamu 3000! 🥰",
      "Kamu tuh kayak AC, bikin adem hatiku terus! ❄️️❤️",
      "Gak butuh gula lagi, soalnya kamu udah manis banget! 🍯",
      "Matahari boleh terbit di timur, tapi cintaku terbit di kamu! ☀️💗",
      "Jangan senyum-senyum terus, nanti aku makin cinta! 🙈💖",
      "Aku gak jago puisi, tapi aku jago sayangin kamu! 🧸✨",
      "Kamu itu jawaban dari semua doa-doaku! 💌🌸"
    ];

    let currentGombalIndex = 0;
    const speechBubble = document.getElementById('speechBubble');

    function nextGombalan() {
      playPopSound();
      currentGombalIndex = (currentGombalIndex + 1) % gombalanList.length;
      speechBubble.style.animation = 'none';
      speechBubble.offsetHeight; // trigger reflow
      speechBubble.style.animation = 'bounce 0.5s ease';
      speechBubble.innerText = gombalanList[currentGombalIndex];
    }

    function triggerMascotReaction() {
      playPopSound();
      const mascot = document.getElementById('mascot');
      mascot.style.transform = 'scale(1.2) rotate(15deg)';
      setTimeout(() => {
        mascot.style.transform = '';
      }, 300);
      
      const randomHearts = ['💖 Love You! 💖', '🥰 Muuuaah! 🥰', '🧸 Peluk Kamu! 🧸'];
      speechBubble.innerText = randomHearts[Math.floor(Math.random() * randomHearts.length)];
    }

    /* ==========================================
       3. HEART BURST / CONFETTI PARTICLES
       ========================================== */
    function burstHearts(e) {
      playPopSound();
      const rect = e.target.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      for (let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.innerText = icons[Math.floor(Math.random() * icons.length)];
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.fontSize = (Math.random() * 15 + 15) + 'px';

        // Calculate random destination
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 120 + 50;
        const dx = Math.cos(angle) * speed + 'px';
        const dy = Math.sin(angle) * speed + 'px';

        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 1000);
      }
    }

    /* ==========================================
       4. AUDIO SYNTHESIZER (WEB AUDIO API)
          Tanpa perlu file audio eksternal!
       ========================================== */
    let audioCtx = null;
    let isPlaying = false;
    let melodyInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playPopSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch(e) {}
    }

    function toggleMusic() {
      initAudio();
      const musicIcon = document.getElementById('musicIcon');
      const musicText = document.getElementById('musicText');

      if (isPlaying) {
        clearInterval(melodyInterval);
        isPlaying = false;
        musicIcon.innerText = '🎵';
        musicText.innerText = 'Putar Musik Romantis';
      } else {
        isPlaying = true;
        musicIcon.innerText = '🎶';
        musicText.innerText = 'Hentikan Musik';
        
        // Simple romantic melody notes (frequencies in Hz)
        const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66];
        let noteIdx = 0;

        melodyInterval = setInterval(() => {
          if (!isPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
          
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);

          noteIdx = (noteIdx + 1) % notes.length;
        }, 400);
      }
    }
  </script>
</body>
</html>
